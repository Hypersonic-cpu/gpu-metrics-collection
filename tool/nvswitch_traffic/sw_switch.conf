# sw_switch —— profile.sh --backend nvswitch 默认配置组：每台物理 NVSwitch 聚合的 rx/tx/total
# key=value，# 开头/行内为注释。profile.sh 读本文件拼 nvswitch_traffic 参数（-l/-e/-i/-r）。
# 采样间隔(-d)与起停(wrap/attach)由 profile.sh 的 --interval-ms + 模式统一控制，不在此设。
# 参数含义详见 tool/nvswitch_traffic/README.md。
level=switch        # 粒度: total(全 fabric 一行) | switch(每台物理 switch) | port(每端口, 256 行/拍)
fields=rx,tx,total  # 采哪些: rx,tx,total 任意组合
switches=all        # 采哪些 switch: all 或 0,1,2,3（本机 4 颗物理 NVSwitch）
raw=0               # 0=速率 GB/s；1=每拍原始累计增量 Mibits
