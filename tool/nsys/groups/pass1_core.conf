# pass1_core —— 第一遍：核心接口 utilization（对齐 tool/dcgmi/pass1_core.txt 的字段集）
# 只写「采什么」；「采多久 / 何时起停」由 nsys-tool 的 -t/-y 控制，不在这里。
# ── Application scope：拼到 nsys launch（只有 wrap / 三段式用得上）──
trace            = none
# ── System scope：拼到 nsys start（attach 也能用）──
sample           = none
cpuctxsw         = none
gpu_metrics_set  = file:sets/pass1_core.config
gpu_metrics_freq = 10000
