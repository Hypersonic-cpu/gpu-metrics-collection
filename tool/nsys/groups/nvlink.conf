# nvlink —— 第三遍：只看 NVLink，RX/TX 各拆 4 路（请求/响应 × 用户/协议）
# 拆开的用处：user data 是有效载荷、protocol data 是协议开销，两者相除得到链路有效率
# （实测 p2p 拷贝下 41.3% : 2.49%，即 ~94% 有效率）——DCGM 只给一个合计值，算不出来。
# ── Application scope ──
trace            = none
# ── System scope ──
sample           = none
cpuctxsw         = none
gpu_metrics_set  = file:sets/nvlink.config
gpu_metrics_freq = 10000
