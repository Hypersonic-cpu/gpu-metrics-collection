# cuda_dram —— kernel 甘特图 + 只留 HBM 读写，采样频率拉满（200 kHz = 5 µs 一个点）
#
# 为什么单独一组：想把 DRAM 带宽和具体 kernel 对到一起看时，`cuda` 组那 30 条序列在
# 200 kHz 下数据量爆炸（30 序列 × 200k × 2 卡 ≈ 12M 点/秒），报告大、写盘慢、GUI 也卡。
# 这一组只留 4 条（GR Active / SMs Active / DRAM 读 / DRAM 写），把预算全花在时间分辨率上。
#
# 尺度参照（本机 Qwen3-30B-A3B TP2 实测）：一次 decode CUDA graph replay ≈ 26 ms / ~970 个 kernel，
# 单个 kernel 中位 3.4 µs。10 kHz（100 µs）一个采样点会把 ~30 个 kernel 糊成一格；
# 200 kHz（5 µs）才够看到单个 kernel 量级的 DRAM 起伏。
#
# 也去掉了 osrt trace 和 CPU 采样：都跟"哪个 kernel 在吃带宽"无关，只会撑大报告。
# ── Application scope ──
trace            = cuda,nvtx
cuda_graph_trace = node
# ── System scope ──
sample           = none
cpuctxsw         = none
gpu_metrics_set  = file:sets/dram.config
gpu_metrics_freq = 200000
