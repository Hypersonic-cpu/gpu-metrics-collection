# cuda_iface_clock — interface metrics plus GPC/SYS clock time series.
#
# Pass 2 uses this group on one GPU at 100 kHz. Pass 3 overrides the
# frequency to 25 kHz and uses all eight GPUs. The group deliberately keeps
# the same 14 interface/SM metrics as cuda_iface_full and adds only the two
# clock metrics.
trace            = cuda,nvtx
cuda_graph_trace = node
sample           = none
cpuctxsw         = none
gpu_metrics_set  = file:sets/iface_clock.config
gpu_metrics_freq = 100000
