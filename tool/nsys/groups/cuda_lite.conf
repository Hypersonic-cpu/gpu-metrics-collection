# cuda_lite —— kernel 甘特图 + CPU 轨，不碰硬件计数器
# ★ 唯一免 sudo 的组：CUDA trace 走 CUPTI Activity API，process-tree 采样只要
#   kernel.perf_event_paranoid <= 2（本机已设为 2）——两者都不需要 root。
#   看 CUDA 时配上 CPU 轨才能判断"kernel 之间的空隙是 GPU 在等 CPU 还是别的"。
#   不采 GPU Metrics（那个恒需 root），所以报告也最小。
# ── Application scope ──
trace            = cuda,nvtx
cuda_graph_trace = node
# ── System scope ──
sample           = process-tree
cpuctxsw         = process-tree
gpu_metrics_set  = none
gpu_metrics_freq = 10000
