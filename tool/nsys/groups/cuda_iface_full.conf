# cuda_iface_full —— kernel 甘特图 + 三个接口的【全部】计数器
#
# 与 `cuda_iface` 唯一的差别：metric set 从 pass1_core（10 条，NVLink 只有 user 2 路）
# 换成 iface_full（**14 条**，NVLink 补全 8 路 = request/response × user/protocol × RX/TX）。
# 补 protocol 那 4 路是为了算链路有效率 user / (user + protocol)。
# PCIe 侧本来就只有收/发 2 条计数器（协议开销已混在里面、拆不开），没有可补的。
#
# ⚠️ 序列数比 cuda_iface 多 40%，采样缓冲压力更大：200 kHz 能开几张卡**必须实测**
#    （`nsys-tool diagnose`），不能从 cuda_iface 的 2×2 结论外推。
#
# ── Application scope ──
trace            = cuda,nvtx
cuda_graph_trace = node
# ── System scope ──
sample           = none
cpuctxsw         = none
gpu_metrics_set  = file:sets/iface_full.config
gpu_metrics_freq = 200000
