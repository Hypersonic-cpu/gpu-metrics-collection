# cuda —— 完整四轨：CUDA kernel/memcpy 甘特图 + NVTX(含 NCCL) + OS runtime + GPU 硬件轨
# ★ 只能 wrap 或三段式用；attach 已在跑的进程拿不到 CUDA 轨（nsys-tool 会直接报错）。
# ── Application scope ──
trace            = cuda,nvtx,osrt
# node = 逐 kernel 展开 CUDA graph；默认的 graph 会把整张图折成一条，图里的 kernel 全看不见。
# 被测程序用 CUDA graph 时（sglang 的 decode 全程在图里）必须 node，否则甘特图是空的。
cuda_graph_trace = node
# ── System scope ──
sample           = process-tree
cpuctxsw         = process-tree
gpu_metrics_set  = gh100
gpu_metrics_freq = 10000
