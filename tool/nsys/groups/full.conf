# full —— nsys 内置 gh100 全集（每卡 30 条序列，含 warp occupancy / clock / tensor pipe）
# 实测 DRAM/NVLink/PCIe 在这一遍里都拿得到，数值与分遍组逐位一致；
# 代价是多出一堆与计算负载无关的图形/warp 曲线（p2p 负载下 34/60 条恒 0），GUI 里要翻。
# 想看的就那几条时用分遍组：-g pass1_core / dram / nvlink / pcie。
# ── Application scope ──
trace            = none
# ── System scope ──
sample           = none
cpuctxsw         = none
gpu_metrics_set  = gh100
gpu_metrics_freq = 10000
