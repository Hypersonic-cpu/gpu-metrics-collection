# cuda_iface —— kernel 甘特图 + 三个接口的带宽（HBM / NVLink / PCIe），高分辨率档
#
# 与 `cuda_dram` 的关系：cuda_dram 只留 DRAM 读写 4 条，把预算全花在时间分辨率上；
# 这一组把 metric set 换成 pass1_core（10 条：GR/SMs + DRAM 读写 + NVLink RX/TX user + PCIe RX/TX），
# 一遍拿齐三个接口 —— 因为 nsys 一次 session 只能给一个 --gpu-metrics-set，
# 想同时看三个接口就只能合成一个 set，没法靠多组拼。
#
# 代价：序列数 4 -> 10，采样缓冲压力变大。200 kHz 下是否溢出必须实测（`nsys-tool diagnose`），
# 不要假设「cuda_dram 在这个频率能跑，这一组也能」。
#
# ── Application scope ──
trace            = cuda,nvtx
cuda_graph_trace = node
# ── System scope ──
sample           = none
cpuctxsw         = none
gpu_metrics_set  = file:sets/pass1_core.config
gpu_metrics_freq = 200000
